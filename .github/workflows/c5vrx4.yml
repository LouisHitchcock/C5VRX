name: C5VRX-4 Experimental Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/c5vrx-4/**'
      - '!**/*.md'
      - 'main/**'
      - '!**/*.md'
      - 'tools/firmware_input_hash.py'
      - 'tools/c5vrx4_version.py'
      - 'sdkconfig*'
      - 'partitions.csv'
      - 'dependencies.lock'
      - 'managed_components/**'
      - 'tools/test_c5vrx4_gate.c'
      - 'tools/test_phy_rx_lab.c'
      - 'tools/test_rx_control_epoch.c'
      - 'tools/phy_lab_stubs/**'
      - 'tools/validate_build.py'
      - '.github/workflows/c5vrx4.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'experiments/c5vrx-4/**'
      - '!**/*.md'
      - 'main/**'
      - '!**/*.md'
      - 'tools/firmware_input_hash.py'
      - 'tools/c5vrx4_version.py'
      - 'sdkconfig*'
      - 'partitions.csv'
      - 'dependencies.lock'
      - 'managed_components/**'
      - 'tools/test_c5vrx4_gate.c'
      - 'tools/test_phy_rx_lab.c'
      - 'tools/test_rx_control_epoch.c'
      - 'tools/phy_lab_stubs/**'
      - 'tools/validate_build.py'
      - '.github/workflows/c5vrx4.yml'
permissions:
  contents: read
concurrency:
  group: c5vrx4-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  version:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve independent C5VRX-4 alpha version
        id: resolve
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PR_NUMBER" ]]; then
            echo "version=4.0.0-alpha-pr.${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=c5vrx4-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            result="$(python3 tools/c5vrx4_version.py)"
            echo "version=$(jq -r .version <<< "$result")" >> "$GITHUB_OUTPUT"
            echo "tag=$(jq -r .tag <<< "$result")" >> "$GITHUB_OUTPUT"
          else
            echo "version=4.0.0-alpha-dev" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
  verify:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify shared architecture and C5VRX-4 PHY ownership
        run: |
          python3 tools/validate_build.py
          gcc -pthread -std=c11 -Wall -Wextra -Werror -Itools/phy_lab_stubs -Imain -Iexperiments/c5vrx-4 tools/test_c5vrx4_gate.c -o /tmp/test_c5vrx4_gate
          /tmp/test_c5vrx4_gate
          gcc -pthread -std=c11 -Wall -Wextra -Werror -DC5VRX_PHY_RX_LAB_PINNED=1 -Itools/phy_lab_stubs -Imain tools/test_phy_rx_lab.c -o /tmp/test_phy_rx_lab
          /tmp/test_phy_rx_lab
          gcc -pthread -std=c11 -Wall -Wextra -Werror -Itools/phy_lab_stubs -Imain tools/test_phy_rx_lab.c -o /tmp/test_phy_rx_readonly
          /tmp/test_phy_rx_readonly
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_rx_control_epoch.c main/direct_gain_v3.c main/arc_phy.c -o /tmp/test_rx_control_epoch
          /tmp/test_rx_control_epoch
          python3 experiments/c5vrx-4/test_cvbs.py
  build:
    needs: [version, verify]
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate experimental program
        run: python3 experiments/c5vrx-4/generate_pipeline.py
      - name: Confirm generated output artifacts are tracked
        run: git diff --exit-code -- experiments/c5vrx-4/*.bsasm experiments/c5vrx-4/cvbs_tables.h
      - name: Build isolated C5VRX-4 target
        shell: bash
        working-directory: experiments/c5vrx-4
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -DIDF_TARGET=esp32c5 -DC5VRX4_VERSION="${{ needs.version.outputs.version }}" build
      - name: Package alpha firmware for web flashing
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p release
          cp experiments/c5vrx-4/build/c5vrx4.bin release/
          cp experiments/c5vrx-4/build/bootloader/bootloader.bin release/
          cp experiments/c5vrx-4/build/partition_table/partition-table.bin release/
          cp experiments/c5vrx-4/build/flasher_args.json release/
          esptool.py --chip esp32c5 merge_bin -o release/c5vrx4_merged.bin \
            --flash_mode dio --flash_size 8MB --flash_freq 80m \
            0x2000 release/bootloader.bin \
            0x8000 release/partition-table.bin \
            0x10000 release/c5vrx4.bin
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > release/COMMIT
          python3 tools/firmware_input_hash.py 4 > release/FIRMWARE_INPUT_SHA
          printf '%s\n' '${{ needs.version.outputs.version }}' > release/VERSION
          cd release
          sha256sum * > SHA256SUMS
      - name: Upload experimental firmware
        uses: actions/upload-artifact@v4
        with:
          name: c5vrx4-experimental-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: release/
  publish-alpha:
    needs: [version, build]
    # Fork builds never receive write-capable publication. Manual publication
    # is limited to main; unmerged builds have their own PR channel.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: c5vrx4-experimental-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/
      - name: Publish C5VRX-4 alpha channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$VERSION_TAG"
          title="C5VRX-4 v${VERSION} — Alpha"
          if [[ -n "$PR_NUMBER" ]]; then
            title="C5VRX-4 Alpha — PR #${PR_NUMBER} / unmerged"
          fi
          # Only PR channels may be replaced. Versioned main releases are immutable.
          if [[ -z "$PR_NUMBER" ]] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            previous="$(mktemp -d)"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern COMMIT --dir "$previous"
            test "$(cat "$previous/COMMIT")" = "$BUILD_SHA"
            rm -rf "$previous"
            echo "Version already published for this commit; leaving it unchanged."
            exit 0
          fi
          previous_tag="$tag"
          if [[ -z "$PR_NUMBER" ]]; then
            previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
              | jq -r '.[] | select(.isDraft == false) | .tagName' \
              | grep -E '^c5vrx4-v4\.[0-9]+\.[0-9]+-alpha\.[0-9]+$' | sort -V | tail -1 || true)"
          fi
          if [[ -n "$previous_tag" ]] && gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            previous="$(mktemp -d)"
            if gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern FIRMWARE_INPUT_SHA --dir "$previous" &&
               cmp -s "$previous/FIRMWARE_INPUT_SHA" release/FIRMWARE_INPUT_SHA; then
              echo "Firmware inputs unchanged; keeping existing alpha build."
              rm -rf "$previous"
              exit 0
            fi
            rm -rf "$previous"
            if [[ -n "$PR_NUMBER" ]]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" --title "$title" --prerelease --latest=false \
            --notes "C5VRX-4 ${VERSION} at ${BUILD_SHA}. Range improvement is not verified. Use Full firmware when switching from C5VRX-3."
  cleanup-alpha:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove closed alpha PR channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tag="c5vrx4-pr-${PR_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
