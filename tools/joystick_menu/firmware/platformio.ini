; C5VRX-5 by Twotoz and the C5VRX contributors: joystick bench firmware.
;
; An ESP32-S3 Super Mini reads an SKRHABE010 5-way switch on a resistor ladder
; and reports it over USB serial for ../menu_mock.py. See ../README.md.
;
;   pio run -e joystick -t upload     the joystick reader (src/joystick.cpp)
;   pio run -e gpioscan -t upload     find which pad the ladder is on (src/gpio_scan.cpp)
;   pio device monitor

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
; The Super Mini's serial is its native USB port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:joystick]
build_src_filter = +<joystick.cpp>
; The GPIO the ladder node is wired to (ADC1: GPIO1-10, ADC2: GPIO11-20).
build_flags =
    ${env.build_flags}
    -DLADDER_PIN=11

[env:gpioscan]
build_src_filter = +<gpio_scan.cpp>
